experiment_name: D12_1_info_asymmetric_masking_sft

teacher_model_name: Qwen/Qwen2.5-Math-7B-Instruct
student_model_name: Qwen/Qwen2.5-1.5B-Instruct

require_cuda: true

data:
  raw_train_path: data/raw/train.jsonl
  raw_test_path: data/raw/test.jsonl
  filtered_trace_path: data/filtered/D12_1/masked_traces.jsonl
  train_dir: data/train/D12_1

output:
  root_dir: outputs/D12_1_info_asymmetric_masking_sft
  adapter_dir: outputs/D12_1_info_asymmetric_masking_sft/adapters
  generation_dir: outputs/D12_1_info_asymmetric_masking_sft/generations
  metrics_dir: outputs/D12_1_info_asymmetric_masking_sft/metrics

sampling:
  seed: 42
  sampling_mode: first_n
  max_train_examples: 200
  max_eval_examples: 100

masking:
  mask_token: "[HIDDEN]"
  split_mode: deterministic_alternating
  min_numbers_per_view: 1
  mask_question_numbers: false

bootstrap:
  num_candidates: 1
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0
  load_in_4bit: true

evaluation:
  max_new_tokens: 512
  temperature: 0.0
  top_p: 1.0

training:
  max_seq_length: 1536
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  num_train_epochs: 1
  logging_steps: 10
  save_steps: 100

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

loss:
  type: standard_sft
